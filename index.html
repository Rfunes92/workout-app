<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ronnie's Workout</title>
  <meta name="description" content="Personal workout planner: LA Fitness, Muay Thai and home gym.">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="26" height="26"><span id="topTitle">Workout</span></div>
    <div class="topmeta" id="topMeta"></div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>

  <div id="restBar" class="restbar hidden" role="timer" aria-live="polite">
    <div class="rest-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" class="ring-bg"/><circle cx="18" cy="18" r="15.5" class="ring-fg" id="restRing"/></svg></div>
    <div class="rest-info"><div class="rest-label">Rest</div><div class="rest-time" id="restTime">0:00</div></div>
    <button class="btn sm ghost" data-rest="-15">−15</button>
    <button class="btn sm ghost" data-rest="15">+15</button>
    <button class="btn sm" data-rest="skip">Skip</button>
  </div>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel"><div class="sheet-grab"></div><div id="sheetBody"></div></div>
  </div>

  <nav class="tabbar">
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 10h2v4H3zM19 10h2v4h-2zM6 7h3v10H6zM15 7h3v10h-3zM9 11h6v2H9z"/></svg><span>Today</span></a>
    <a href="#food" data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 2v8a2 2 0 0 0 2 2v10M5 2v6M9 2v6M17 2c-2 1.5-3 4-3 7v4h3v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Food</span></a>
    <a href="#week" data-tab="week"><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM4 9h16M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Week</span></a>
    <a href="#library" data-tab="library"><svg viewBox="0 0 24 24"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 4.5l3.8-1 3.7 15.5-3.8 1z" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Library</span></a>
    <a href="#setup" data-tab="setup"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.3 5.1l1.7 1.3-2 3.4-2-.8a7.7 7.7 0 0 1-2.2 1.3l-.3 2.2h-4l-.3-2.2a7.7 7.7 0 0 1-2.2-1.3l-2 .8-2-3.4 1.7-1.3a7.7 7.7 0 0 1 0-2.6L1.7 9.7l2-3.4 2 .8A7.7 7.7 0 0 1 8 5.8l.3-2.2h4l.3 2.2a7.7 7.7 0 0 1 2.2 1.3l2-.8 2 3.4-1.7 1.3a7.7 7.7 0 0 1 0 2.6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Setup</span></a>
  </nav>

  <script src="js/exercises.js"></script>
  <script src="js/bodymap.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/foods-seed.js"></script>
  <script src="js/food.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
